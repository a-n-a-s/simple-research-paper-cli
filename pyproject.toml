[project]
name = "researchhub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "a-n-a-s", email = "mirzaanas815@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "respx>=0.23.1",
]

[project.scripts]
researchhub = "researchhub:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
